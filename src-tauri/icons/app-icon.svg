<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
    <defs>
        <!-- Background squircle gradient -->
        <radialGradient id="bg" cx="50%" cy="40%" r="75%">
            <stop offset="0%" stop-color="#1a0d33" />
            <stop offset="60%" stop-color="#0a0612" />
            <stop offset="100%" stop-color="#05030a" />
        </radialGradient>

        <!-- Hexagon outer stroke gradient (cyan → magenta) -->
        <linearGradient id="hexStroke" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#39e7ff" />
            <stop offset="55%" stop-color="#7d4bff" />
            <stop offset="100%" stop-color="#ff4ddb" />
        </linearGradient>

        <!-- N letter gradient -->
        <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#39e7ff" />
            <stop offset="50%" stop-color="#bd8cff" />
            <stop offset="100%" stop-color="#ff4ddb" />
        </linearGradient>

        <!-- Inner soft glow -->
        <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#7d4bff" stop-opacity="0.45" />
            <stop offset="70%" stop-color="#7d4bff" stop-opacity="0" />
        </radialGradient>

        <!-- Glow filter for N -->
        <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="14" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <filter id="hexGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="b" />
            <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Rounded-square background -->
    <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)" />
    <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#innerGlow)" />

    <!-- Faint outer hex ring -->
    <polygon points="512,120 856,316 856,708 512,904 168,708 168,316"
        fill="none" stroke="url(#hexStroke)" stroke-width="6" opacity="0.25" />

    <!-- Main hexagon -->
    <polygon points="512,180 808,344 808,680 512,844 216,680 216,344"
        fill="none" stroke="url(#hexStroke)" stroke-width="18"
        stroke-linejoin="round" filter="url(#hexGlow)" />

    <!-- Inner hex panel (subtle fill) -->
    <polygon points="512,240 760,378 760,646 512,784 264,646 264,378"
        fill="#0d0820" stroke="#7d4bff" stroke-width="2" stroke-opacity="0.4" />

    <!-- Stylized "N" -->
    <g filter="url(#neon)">
        <!-- left vertical -->
        <rect x="338" y="320" width="74" height="384" rx="10" fill="url(#nGrad)" />
        <!-- right vertical -->
        <rect x="612" y="320" width="74" height="384" rx="10" fill="url(#nGrad)" />
        <!-- diagonal slab connecting top-left to bottom-right of the verticals -->
        <polygon points="412,320 486,320 686,704 612,704" fill="url(#nGrad)" />
    </g>

    <!-- Accent dot (Esper cycle node) -->
    <circle cx="760" cy="280" r="14" fill="#39e7ff">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Bottom tick marks for hex vertices -->
    <g fill="#ff4ddb" opacity="0.9">
        <circle cx="512" cy="180" r="9" />
        <circle cx="808" cy="344" r="9" />
        <circle cx="808" cy="680" r="9" />
        <circle cx="512" cy="844" r="9" />
        <circle cx="216" cy="680" r="9" />
        <circle cx="216" cy="344" r="9" />
    </g>
</svg>